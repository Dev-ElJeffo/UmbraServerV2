name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check PR title
      uses: amannn/action-semantic-pull-request@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          chore
    
    - name: Check for TODO comments
      run: |
        if git diff origin/${{ github.base_ref }}...HEAD | grep -i "TODO"; then
          echo "⚠️  Warning: New TODO comments found in this PR"
          echo "Please resolve or create issues for them"
        fi
    
    - name: Check file sizes
      run: |
        # Verificar se há arquivos muito grandes
        git diff --name-only origin/${{ github.base_ref }}...HEAD | while read file; do
          if [ -f "$file" ]; then
            size=$(wc -c < "$file")
            if [ $size -gt 1000000 ]; then
              echo "❌ Error: File $file is too large ($(($size / 1024))KB)"
              exit 1
            fi
          fi
        done
    
    - name: Detect secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.pull_request.base.sha }}
        head: ${{ github.event.pull_request.head.sha }}

  auto-label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    
    steps:
    - name: Label based on files
      uses: actions/labeler@v4
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

