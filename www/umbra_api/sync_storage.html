<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronizar Storage - UmbraEternum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 6px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .result.loading {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }

        .result h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .result pre {
            background: rgba(0, 0, 0, 0.05);
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
            margin-top: 10px;
        }

        .info {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #0c5460;
        }

        .info strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Sincronizar Storage</h1>
        <p class="subtitle">Sincroniza itens do storage com a tabela player_storage</p>

        <div class="info">
            <strong>ℹ️ Como usar:</strong>
            <ol style="margin-left: 20px; margin-top: 8px;">
                <li>Cole seu JWT token no campo abaixo</li>
                <li>Clique em "Sincronizar Storage"</li>
                <li>Aguarde a resposta do servidor</li>
            </ol>
        </div>

        <div class="form-group">
            <label for="token">JWT Token:</label>
            <input 
                type="text" 
                id="token" 
                placeholder="Cole seu token JWT aqui..."
                autocomplete="off"
            >
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="syncStorage()" id="syncBtn">
                🔄 Sincronizar Storage
            </button>
            <button class="btn-secondary" onclick="clearResult()">
                🗑️ Limpar
            </button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        const API_URL = 'http://localhost/umbra_api/api/storage/sync_storage.php';

        async function syncStorage() {
            const tokenInput = document.getElementById('token');
            const token = tokenInput.value.trim();
            const resultDiv = document.getElementById('result');
            const syncBtn = document.getElementById('syncBtn');

            // Validar token
            if (!token) {
                showResult('error', 'Erro', 'Por favor, insira um token JWT válido.');
                return;
            }

            // Mostrar loading
            showResult('loading', 'Sincronizando...', 'Aguarde, sincronizando storage...');
            syncBtn.disabled = true;
            syncBtn.textContent = '⏳ Sincronizando...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token: token })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showResult('success', 
                        '✅ Sincronização Concluída!', 
                        `Itens sincronizados: ${data.synced_items || 0}\n` +
                        `Itens atualizados: ${data.updated_items || 0}\n\n` +
                        `Resposta completa:\n${JSON.stringify(data, null, 2)}`
                    );
                } else {
                    showResult('error', 
                        '❌ Erro na Sincronização', 
                        `Mensagem: ${data.message || 'Erro desconhecido'}\n\n` +
                        `Resposta completa:\n${JSON.stringify(data, null, 2)}`
                    );
                }
            } catch (error) {
                showResult('error', 
                    '❌ Erro de Conexão', 
                    `Não foi possível conectar ao servidor.\n\n` +
                    `Erro: ${error.message}\n\n` +
                    `Verifique se:\n` +
                    `- O servidor está rodando\n` +
                    `- A URL está correta: ${API_URL}`
                );
            } finally {
                syncBtn.disabled = false;
                syncBtn.textContent = '🔄 Sincronizar Storage';
            }
        }

        function showResult(type, title, message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = `
                <h3>${title}</h3>
                <pre>${message}</pre>
            `;
            resultDiv.style.display = 'block';
        }

        function clearResult() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'none';
            document.getElementById('token').value = '';
        }

        // Permitir Enter para sincronizar
        document.getElementById('token').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                syncStorage();
            }
        });
    </script>
</body>
</html>
