<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - UmbraEternum</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/dark-fantasy.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/animations.css">
    
    <style>
        body {
            background: linear-gradient(135deg, rgba(10, 10, 15, 0.95) 0%, rgba(26, 26, 46, 0.95) 100%),
                        url('assets/images/backgrounds/login-bg.jpg') center/cover no-repeat fixed;
            min-height: 100vh;
            padding: var(--spacing-lg);
        }
        
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .dashboard-header {
            background: var(--color-bg-card);
            border: 2px solid var(--color-red-medium);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
            box-shadow: var(--shadow-2xl), var(--shadow-red-strong);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideInDown 0.6s ease;
        }
        
        .welcome-section {
            flex: 1;
        }
        
        .welcome-title {
            font-family: var(--font-title);
            font-size: var(--font-size-3xl);
            color: var(--color-red-bright);
            margin-bottom: var(--spacing-xs);
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
        }
        
        .welcome-subtitle {
            color: var(--color-text-secondary);
            font-size: var(--font-size-base);
        }
        
        .user-section {
            text-align: right;
        }
        
        .username-display {
            font-family: var(--font-heading);
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-xs);
        }
        
        .email-display {
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
            margin-bottom: var(--spacing-md);
        }
        
        .admin-badge {
            display: inline-block;
            padding: 4px 12px;
            background: linear-gradient(135deg, var(--color-red-medium) 0%, var(--color-red-bright) 100%);
            color: var(--color-text-primary);
            border-radius: 20px;
            font-size: var(--font-size-xs);
            font-weight: 700;
            margin-left: var(--spacing-sm);
            box-shadow: var(--shadow-red);
        }
        
        .header-buttons {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-sm);
        }
        
        .btn-admin {
            background: linear-gradient(135deg, var(--color-red-medium) 0%, var(--color-red-bright) 100%);
            color: var(--color-text-primary);
        }
        
        .btn-logout {
            background: var(--color-bg-tertiary);
            border: 1px solid var(--color-border-medium);
        }
        
        .btn-logout:hover {
            background: var(--color-red-dark);
            border-color: var(--color-red-medium);
        }
        
        .dashboard-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: var(--spacing-xl);
        }
        
        .info-card {
            background: var(--color-bg-card);
            border: 2px solid var(--color-border-dark);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-lg);
            animation: slideInUp 0.6s ease;
            transition: all var(--transition-base);
        }
        
        .info-card:hover {
            border-color: var(--color-red-dark);
            box-shadow: var(--shadow-red);
        }
        
        .card-title {
            font-family: var(--font-heading);
            font-size: var(--font-size-2xl);
            color: var(--color-red-bright);
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--color-border-dark);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: var(--spacing-md) 0;
            border-bottom: 1px solid var(--color-border-dark);
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: var(--color-text-secondary);
            font-weight: 500;
        }
        
        .stat-value {
            color: var(--color-text-primary);
            font-weight: 600;
        }
        
        .token-display {
            background: var(--color-bg-primary);
            border: 1px dashed var(--color-red-dark);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }
        
        .token-label {
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
            margin-bottom: var(--spacing-sm);
        }
        
        .token-value {
            font-family: 'Courier New', monospace;
            font-size: var(--font-size-xs);
            color: var(--color-red-bright);
            word-break: break-all;
            background: var(--color-bg-secondary);
            padding: var(--spacing-sm);
            border-radius: var(--radius-sm);
        }
        
        .no-players {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--color-text-muted);
        }
        
        .no-players-icon {
            font-size: var(--font-size-5xl);
            margin-bottom: var(--spacing-lg);
        }
        
        .create-player-btn {
            margin-top: var(--spacing-lg);
        }
        
        .player-card {
            background: var(--color-bg-tertiary);
            border: 2px solid var(--color-border-dark);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            cursor: pointer;
            transition: all var(--transition-base);
            border-left: 4px solid var(--color-red-medium);
        }
        
        .player-card:hover {
            border-color: var(--color-red-bright);
            background: var(--color-bg-secondary);
            transform: translateX(4px);
            box-shadow: var(--shadow-red);
        }
        
        .player-name {
            font-family: var(--font-heading);
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--color-red-bright);
            margin-bottom: var(--spacing-sm);
        }
        
        .player-info {
            display: flex;
            gap: var(--spacing-lg);
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }
        
        .player-info span {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }
        
        .dashboard-links {
            text-align: center;
            margin-top: var(--spacing-xl);
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--color-border-dark);
        }
        
        .dashboard-links a {
            color: var(--color-red-bright);
            margin: 0 var(--spacing-lg);
            transition: all var(--transition-fast);
        }
        
        .dashboard-links a:hover {
            color: var(--color-red-light);
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }
        
        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                text-align: center;
            }
            
            .user-section {
                text-align: center;
                margin-top: var(--spacing-lg);
            }
            
            .header-buttons {
                justify-content: center;
            }
            
            .dashboard-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <div class="dashboard-header">
            <div class="welcome-section">
                <h1 class="welcome-title">
                    <i class="fas fa-dungeon"></i>
                    Dashboard
                </h1>
                <p class="welcome-subtitle">Bem-vindo ao UmbraEternum</p>
            </div>
            <div class="user-section">
                <div class="username-display" id="displayUsername">-</div>
                <div class="email-display" id="displayEmail">-</div>
                <div id="adminButtons" style="display: none;">
                    <div class="header-buttons">
                        <button class="btn btn-primary btn-sm btn-admin" onclick="goToAdmin()">
                            <i class="fas fa-crown"></i> Painel Admin
                        </button>
                        <button class="btn btn-secondary btn-sm btn-logout" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Sair
                        </button>
                    </div>
                </div>
                <div id="normalButtons">
                    <button class="btn btn-secondary btn-sm btn-logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Content -->
        <div class="dashboard-content">
            <!-- Account Info Card -->
            <div class="info-card">
                <h2 class="card-title">
                    <i class="fas fa-user-circle"></i>
                    Informações da Conta
                </h2>
                <div class="stat-item">
                    <span class="stat-label">ID da Conta</span>
                    <span class="stat-value" id="accountId">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Username</span>
                    <span class="stat-value" id="accountUsername">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Email</span>
                    <span class="stat-value" id="accountEmail">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Personagens</span>
                    <span class="stat-value" id="playerCount">0</span>
                </div>
                
                <div class="token-display">
                    <div class="token-label">
                        <i class="fas fa-key"></i> Token de Autenticação
                    </div>
                    <div class="token-value" id="authToken">-</div>
                </div>
            </div>
            
            <!-- Players Card -->
            <div class="info-card">
                <h2 class="card-title">
                    <i class="fas fa-users"></i>
                    Meus Personagens
                </h2>
                <div id="playersList">
                    <div class="no-players">
                        <div class="no-players-icon"><i class="fas fa-user-slash"></i></div>
                        <p>Você ainda não tem personagens</p>
                        <button class="btn btn-primary create-player-btn" onclick="createPlayer()">
                            <i class="fas fa-plus-circle"></i> Criar Personagem
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Links -->
        <div class="dashboard-links">
            <a href="index.html">
                <i class="fas fa-home"></i> Voltar para Início
            </a>
            <a href="#" onclick="refreshData(); return false;">
                <i class="fas fa-sync-alt"></i> Atualizar Dados
            </a>
        </div>
    </div>
    
    <script src="scripts/api-client.js"></script>
    <script src="scripts/components.js"></script>
    
    <script>
        // TODA A LÓGICA ORIGINAL MANTIDA INTACTA
        const token = sessionStorage.getItem('auth_token');
        const userData = sessionStorage.getItem('user_data');
        const playersData = sessionStorage.getItem('players');
        
        if (!token || !userData) {
            window.location.href = 'login.html';
        } else {
            loadUserData();
        }
        
        function loadUserData() {
            try {
                const user = JSON.parse(userData);
                const players = JSON.parse(playersData);
                
                const usernameDisplay = document.getElementById('displayUsername');
                usernameDisplay.textContent = user.username;
                
                if (user.isadmin === 1) {
                    const badge = document.createElement('span');
                    badge.className = 'admin-badge';
                    badge.innerHTML = '<i class="fas fa-crown"></i> ADMIN';
                    usernameDisplay.appendChild(badge);
                    
                    document.getElementById('adminButtons').style.display = 'block';
                    document.getElementById('normalButtons').style.display = 'none';
                }
                
                document.getElementById('displayEmail').textContent = user.email;
                document.getElementById('accountId').textContent = user.id;
                document.getElementById('accountUsername').textContent = user.username;
                document.getElementById('accountEmail').textContent = user.email;
                document.getElementById('playerCount').textContent = players.length;
                document.getElementById('authToken').textContent = token;
                
                if (players.length > 0) {
                    displayPlayers(players);
                }
            } catch (e) {
                console.error('Erro ao carregar dados:', e);
                Toast.error('Erro ao carregar dados do usuário');
            }
        }
        
        function goToAdmin() {
            window.location.href = 'admin.html';
        }
        
        function displayPlayers(players) {
            const container = document.getElementById('playersList');
            container.innerHTML = '';
            
            players.forEach(player => {
                const playerId = player.player_id ?? player.id;
                const card = document.createElement('div');
                card.className = 'player-card';
                card.innerHTML = `
                    <div class="player-name">${player.character_name}</div>
                    <div class="player-info">
                        <span><i class="fas fa-sword"></i> Level ${player.level}</span>
                        <span><i class="fas fa-map-marked-alt"></i> ${player.current_zone || 'Zona Inicial'}</span>
                    </div>
                `;
                card.onclick = () => selectCharacter(playerId);
                container.appendChild(card);
            });
        }
        
        async function selectCharacter(playerId) {
            const authToken = sessionStorage.getItem('auth_token');
            if (!authToken) {
                Toast.error('Token não encontrado. Faça login novamente.');
                return;
            }
            try {
                Loading.show('Selecionando personagem...');
                const response = await fetch('api/character/select_character.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: authToken, player_id: playerId })
                });
                const result = await response.json();
                Loading.hide();
                
                if (result.success && result.token) {
                    sessionStorage.setItem('auth_token', result.token);
                    document.getElementById('authToken').textContent = result.token;
                    Toast.success('Personagem selecionado! Token atualizado.');
                } else {
                    Toast.error(result.message || 'Falha ao selecionar personagem');
                }
            } catch (error) {
                Loading.hide();
                Toast.error('Erro ao conectar com servidor');
            }
        }
        
        function logout() {
            if (confirm('Tem certeza que deseja sair?')) {
                sessionStorage.clear();
                window.location.href = 'login.html';
            }
        }
        
        function createPlayer() {
            Toast.info('Funcionalidade em desenvolvimento!\nEm breve você poderá criar personagens.');
        }
        
        async function refreshData() {
            const user = JSON.parse(userData);
            const password = prompt('Digite sua senha para atualizar:');
            
            if (!password) return;
            
            try {
                Loading.show('Atualizando dados...');
                const response = await fetch('api/login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: user.username,
                        password: password
                    })
                });
                
                const result = await response.json();
                Loading.hide();
                
                if (result.success) {
                    sessionStorage.setItem('auth_token', result.token);
                    sessionStorage.setItem('user_data', JSON.stringify(result.account));
                    sessionStorage.setItem('players', JSON.stringify(result.players));
                    Toast.success('Dados atualizados com sucesso!');
                    setTimeout(() => location.reload(), 1000);
                } else {
                    Toast.error('Erro ao atualizar: ' + result.message);
                }
            } catch (error) {
                Loading.hide();
                Toast.error('Erro ao conectar com servidor');
            }
        }
        
        // Adicionar partículas ao fundo
        document.addEventListener('DOMContentLoaded', () => {
            const particles = 15;
            for (let i = 0; i < particles; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                particle.style.animationDuration = `${5 + Math.random() * 5}s`;
                document.body.appendChild(particle);
            }
        });
    </script>
</body>
</html>
