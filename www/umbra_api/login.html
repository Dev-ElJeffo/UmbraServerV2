<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UmbraEternum</title>
    
    <!-- Fontes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="styles/dark-fantasy.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/animations.css">
    
    <style>
        body {
            background: linear-gradient(135deg, rgba(10, 10, 15, 0.95) 0%, rgba(26, 26, 46, 0.95) 100%),
                        url('assets/images/backgrounds/login-bg.jpg') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            position: relative;
            overflow: hidden;
        }
        
        /* Partículas de fundo */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(196, 30, 58, 0.1) 0%, transparent 50%);
            animation: pulse 6s ease-in-out infinite;
            pointer-events: none;
        }
        
        .login-container {
            background: var(--color-bg-card);
            border: 2px solid var(--color-red-medium);
            border-radius: var(--radius-xl);
            padding: var(--spacing-2xl);
            box-shadow: var(--shadow-2xl), var(--shadow-red-strong);
            max-width: 480px;
            width: 100%;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
            animation: slideInUp 0.8s ease;
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--color-red-bright), transparent);
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .logo-image {
            width: 120px;
            height: 120px;
            margin: 0 auto var(--spacing-lg);
            filter: drop-shadow(0 0 20px rgba(255, 68, 68, 0.5));
            animation: float 3s ease-in-out infinite;
        }
        
        .logo-title {
            font-family: var(--font-title);
            font-size: var(--font-size-4xl);
            color: var(--color-red-bright);
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
            margin-bottom: var(--spacing-xs);
            letter-spacing: 0.1em;
        }
        
        .logo-subtitle {
            font-family: var(--font-heading);
            font-size: var(--font-size-lg);
            color: var(--color-text-secondary);
            letter-spacing: 0.05em;
        }
        
        .divider-ornament {
            margin: var(--spacing-xl) 0;
        }
        
        .input-group {
            margin-bottom: var(--spacing-lg);
            position: relative;
        }
        
        .input-group .input-label {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-sm);
        }
        
        .input-group .input-label i {
            color: var(--color-red-medium);
        }
        
        .input-with-icon {
            position: relative;
        }
        
        .input-with-icon i {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-red-medium);
            font-size: var(--font-size-lg);
        }
        
        .input-with-icon input {
            padding-left: 3rem;
        }
        
        .forgot-password {
            text-align: right;
            margin-top: calc(var(--spacing-md) * -1);
            margin-bottom: var(--spacing-md);
        }
        
        .forgot-password a {
            font-size: var(--font-size-sm);
            color: var(--color-red-medium);
            transition: color var(--transition-fast);
        }
        
        .forgot-password a:hover {
            color: var(--color-red-bright);
        }
        
        .remember-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .submit-btn {
            width: 100%;
            margin-bottom: var(--spacing-lg);
            position: relative;
            overflow: hidden;
        }
        
        .submit-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .submit-btn:hover::after {
            width: 300px;
            height: 300px;
        }
        
        .links-section {
            text-align: center;
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--color-border-dark);
        }
        
        .links-section p {
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-sm);
        }
        
        .links-section a {
            color: var(--color-red-bright);
            font-weight: 600;
            transition: all var(--transition-fast);
        }
        
        .links-section a:hover {
            color: var(--color-red-light);
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .login-container {
                padding: var(--spacing-xl);
            }
            
            .logo-image {
                width: 80px;
                height: 80px;
            }
            
            .logo-title {
                font-size: var(--font-size-3xl);
            }
        }
    </style>
</head>
<body>
    <!-- Container principal -->
    <div class="login-container">
        <!-- Logo e título -->
        <div class="logo-section">
            <img src="assets/images/logo.svg" alt="UmbraEternum" class="logo-image">
            <h1 class="logo-title">UMBRA</h1>
            <p class="logo-subtitle">Entre nas Trevas Eternas</p>
        </div>
        
        <div class="divider-ornament">
            <i class="fas fa-dragon"></i>
        </div>
        
        <!-- Alert para mensagens -->
        <div id="alert" class="alert" style="display: none;"></div>
        
        <!-- Formulário de Login -->
        <form id="loginForm">
            <div class="input-group">
                <label class="input-label">
                    <i class="fas fa-user"></i>
                    <span>Usuário</span>
                </label>
                <div class="input-with-icon">
                    <i class="fas fa-sword"></i>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           class="input-medieval" 
                           placeholder="Digite seu nome de usuário" 
                           required 
                           autofocus>
                </div>
            </div>
            
            <div class="input-group">
                <label class="input-label">
                    <i class="fas fa-lock"></i>
                    <span>Senha</span>
                </label>
                <div class="input-with-icon">
                    <i class="fas fa-shield-alt"></i>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="input-medieval" 
                           placeholder="Digite sua senha" 
                           required>
                </div>
            </div>
            
            <div class="forgot-password">
                <a href="#" onclick="alert('Funcionalidade em desenvolvimento'); return false;">
                    Esqueceu a senha?
                </a>
            </div>
            
            <div class="remember-group">
                <label class="checkbox-medieval">
                    <input type="checkbox" id="remember" name="remember">
                    <span>Lembrar de mim neste dispositivo</span>
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary submit-btn" id="submitBtn">
                <i class="fas fa-sign-in-alt"></i>
                Entrar no Reino
            </button>
        </form>
        
        <!-- Links -->
        <div class="links-section">
            <p>Primeira vez aqui? <a href="register.html">Criar Conta</a></p>
            <p><a href="index.html"><i class="fas fa-arrow-left"></i> Voltar para página inicial</a></p>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="scripts/api-client.js"></script>
    <script src="scripts/components.js"></script>
    
    <script>
        // LÓGICA MANTIDA DO ORIGINAL
        const form = document.getElementById('loginForm');
        const alert = document.getElementById('alert');
        const submitBtn = document.getElementById('submitBtn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('remember');
        
        // Verificar se veio do registro
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('registered') === '1') {
            const username = urlParams.get('username');
            showAlert(`✅ Conta criada com sucesso! Bem-vindo, ${username}!`, 'success');
            if (username) {
                usernameInput.value = username;
                passwordInput.focus();
            }
        }
        
        // Carregar username salvo
        const savedUsername = localStorage.getItem('remembered_username');
        if (savedUsername) {
            usernameInput.value = savedUsername;
            rememberCheckbox.checked = true;
        }
        
        // Enviar formulário
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Desabilitar botão
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';
            
            // Dados
            const data = {
                username: usernameInput.value,
                password: passwordInput.value
            };
            
            try {
                const response = await fetch('api/login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Salvar username se checkbox marcado
                    if (rememberCheckbox.checked) {
                        localStorage.setItem('remembered_username', usernameInput.value);
                    } else {
                        localStorage.removeItem('remembered_username');
                    }
                    
                    // Salvar dados da sessão
                    sessionStorage.setItem('auth_token', result.token);
                    sessionStorage.setItem('user_data', JSON.stringify(result.account));
                    sessionStorage.setItem('players', JSON.stringify(result.players));
                    
                    showAlert(`✅ ${result.message} Redirecionando...`, 'success');
                    
                    // Redirecionar após 1.5 segundos
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    showAlert(`❌ ${result.message}`, 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar no Reino';
                }
            } catch (error) {
                showAlert('❌ Erro ao conectar com servidor', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar no Reino';
            }
        });
        
        function showAlert(message, type) {
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            alert.style.animation = 'slideDown 0.3s ease';
            
            setTimeout(() => {
                alert.style.animation = 'fadeOut 0.3s ease';
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 300);
            }, 5000);
        }
        
        // Adicionar efeito de partículas ao fundo
        document.addEventListener('DOMContentLoaded', () => {
            const particles = 20;
            for (let i = 0; i < particles; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                particle.style.animationDuration = `${5 + Math.random() * 5}s`;
                document.body.appendChild(particle);
            }
        });
    </script>
</body>
</html>
