<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Storage - UmbraEternum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 6px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .result.loading {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }

        .result h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .result pre {
            background: rgba(0, 0, 0, 0.05);
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 10px;
            max-height: 600px;
            overflow-y: auto;
        }

        .info {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #0c5460;
        }

        .info strong {
            display: block;
            margin-bottom: 5px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .stat-card h4 {
            color: #667eea;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug Storage</h1>
        <p class="subtitle">Testa a API get_storage.php e exibe informações detalhadas</p>

        <div class="info">
            <strong>ℹ️ Como usar:</strong>
            <ol style="margin-left: 20px; margin-top: 8px;">
                <li>Cole seu JWT token no campo abaixo</li>
                <li>Clique em "Carregar Storage"</li>
                <li>Analise a resposta do servidor e os dados retornados</li>
            </ol>
        </div>

        <div class="form-group">
            <label for="token">JWT Token:</label>
            <input 
                type="text" 
                id="token" 
                placeholder="Cole seu token JWT aqui..."
                autocomplete="off"
            >
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="loadStorage()" id="loadBtn">
                📦 Carregar Storage
            </button>
            <button class="btn-secondary" onclick="clearResult()">
                🗑️ Limpar
            </button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        const API_URL = 'http://localhost/umbra_api/api/storage/get_storage.php';

        async function loadStorage() {
            const tokenInput = document.getElementById('token');
            const token = tokenInput.value.trim();
            const resultDiv = document.getElementById('result');
            const loadBtn = document.getElementById('loadBtn');

            // Validar token
            if (!token) {
                showResult('error', 'Erro', 'Por favor, insira um token JWT válido.');
                return;
            }

            // Mostrar loading
            showResult('loading', 'Carregando...', 'Aguarde, carregando storage...');
            loadBtn.disabled = true;
            loadBtn.textContent = '⏳ Carregando...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token: token })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    const storageItems = data.storage || [];
                    
                    // Estatísticas
                    let statsHtml = '<div class="stats">';
                    statsHtml += `<div class="stat-card"><h4>Total de Itens</h4><div class="value">${storageItems.length}</div></div>`;
                    statsHtml += `<div class="stat-card"><h4>Total Items (API)</h4><div class="value">${data.total_items || 0}</div></div>`;
                    
                    // Contar slots ocupados
                    const occupiedSlots = storageItems.filter(item => item.slot_index >= 50 && item.slot_index < 150).length;
                    statsHtml += `<div class="stat-card"><h4>Slots Ocupados</h4><div class="value">${occupiedSlots}</div></div>`;
                    
                    // Verificar storage_id
                    const withStorageID = storageItems.filter(item => item.storage_id > 0).length;
                    statsHtml += `<div class="stat-card"><h4>Com Storage ID</h4><div class="value">${withStorageID}</div></div>`;
                    statsHtml += '</div>';

                    // Lista de itens
                    let itemsHtml = '<h3 style="margin-top: 20px; margin-bottom: 10px;">📦 Itens no Storage:</h3>';
                    if (storageItems.length === 0) {
                        itemsHtml += '<p style="color: #666; font-style: italic;">Nenhum item encontrado no storage.</p>';
                    } else {
                        itemsHtml += '<table style="width: 100%; border-collapse: collapse; margin-top: 10px;">';
                        itemsHtml += '<thead><tr style="background: #f0f0f0;"><th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Storage ID</th><th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Inventory ID</th><th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Slot Index</th><th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Item Name</th><th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Quantity</th></tr></thead>';
                        itemsHtml += '<tbody>';
                        storageItems.forEach(item => {
                            itemsHtml += `<tr style="border-bottom: 1px solid #ddd;">
                                <td style="padding: 8px; border: 1px solid #ddd;">${item.storage_id || 0}</td>
                                <td style="padding: 8px; border: 1px solid #ddd;">${item.inventory_id}</td>
                                <td style="padding: 8px; border: 1px solid #ddd;">${item.slot_index}</td>
                                <td style="padding: 8px; border: 1px solid #ddd;">${item.item_name || 'N/A'}</td>
                                <td style="padding: 8px; border: 1px solid #ddd;">${item.quantity || 1}</td>
                            </tr>`;
                        });
                        itemsHtml += '</tbody></table>';
                    }

                    showResult('success', 
                        '✅ Storage Carregado!', 
                        statsHtml + itemsHtml + 
                        `<h3 style="margin-top: 20px; margin-bottom: 10px;">📄 Resposta Completa (JSON):</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>`
                    );
                } else {
                    showResult('error', 
                        '❌ Erro ao Carregar Storage', 
                        `Mensagem: ${data.message || 'Erro desconhecido'}\n\n` +
                        `Resposta completa:\n${JSON.stringify(data, null, 2)}`
                    );
                }
            } catch (error) {
                showResult('error', 
                    '❌ Erro de Conexão', 
                    `Não foi possível conectar ao servidor.\n\n` +
                    `Erro: ${error.message}\n\n` +
                    `Verifique se:\n` +
                    `- O servidor está rodando\n` +
                    `- A URL está correta: ${API_URL}`
                );
            } finally {
                loadBtn.disabled = false;
                loadBtn.textContent = '📦 Carregar Storage';
            }
        }

        function showResult(type, title, message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = `
                <h3>${title}</h3>
                <div>${message}</div>
            `;
            resultDiv.style.display = 'block';
        }

        function clearResult() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'none';
            document.getElementById('token').value = '';
        }

        // Permitir Enter para carregar
        document.getElementById('token').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadStorage();
            }
        });
    </script>
</body>
</html>
