<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fundo circular -->
  <circle cx="256" cy="256" r="240" fill="#0a0a0f" stroke="url(#redGradient)" stroke-width="8"/>
  
  <!-- Ornamento superior -->
  <path d="M256 40 L280 80 L240 80 Z" fill="url(#redGradient)" filter="url(#glow)"/>
  
  <!-- Letra U estilizada -->
  <text x="256" y="320" font-family="Cinzel, serif" font-size="180" font-weight="900" 
        text-anchor="middle" fill="url(#redGradient)" filter="url(#glow)">U</text>
  
  <!-- Bordas decorativas -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#redGradient)" stroke-width="2" opacity="0.5"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#redGradient)" stroke-width="1" opacity="0.3"/>
  
  <!-- Texto -->
  <text x="256" y="440" font-family="Cormorant Garamond, serif" font-size="48" font-weight="600"
        text-anchor="middle" fill="#c41e3a" letter-spacing="8">UMBRA</text>
  <text x="256" y="470" font-family="Cormorant Garamond, serif" font-size="32" font-weight="400"
        text-anchor="middle" fill="#8b0000" letter-spacing="6">ETERNUM</text>
</svg>
