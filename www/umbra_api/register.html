<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - UmbraEternum</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/dark-fantasy.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/animations.css">
    
    <style>
        body {
            background: linear-gradient(135deg, rgba(10, 10, 15, 0.95) 0%, rgba(26, 26, 46, 0.95) 100%),
                        url('assets/images/backgrounds/login-bg.jpg') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(196, 30, 58, 0.1) 0%, transparent 50%);
            animation: pulse 6s ease-in-out infinite;
            pointer-events: none;
        }
        
        .register-container {
            background: var(--color-bg-card);
            border: 2px solid var(--color-red-medium);
            border-radius: var(--radius-xl);
            padding: var(--spacing-2xl);
            box-shadow: var(--shadow-2xl), var(--shadow-red-strong);
            max-width: 480px;
            width: 100%;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
            animation: slideInUp 0.8s ease;
        }
        
        .register-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--color-red-bright), transparent);
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .logo-image {
            width: 100px;
            height: 100px;
            margin: 0 auto var(--spacing-md);
            filter: drop-shadow(0 0 20px rgba(255, 68, 68, 0.5));
            animation: float 3s ease-in-out infinite;
        }
        
        .logo-title {
            font-family: var(--font-title);
            font-size: var(--font-size-3xl);
            color: var(--color-red-bright);
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
            margin-bottom: var(--spacing-xs);
            letter-spacing: 0.1em;
        }
        
        .logo-subtitle {
            font-family: var(--font-heading);
            font-size: var(--font-size-base);
            color: var(--color-text-secondary);
            letter-spacing: 0.05em;
        }
        
        .divider-ornament {
            margin: var(--spacing-lg) 0;
        }
        
        .input-group {
            margin-bottom: var(--spacing-md);
            position: relative;
        }
        
        .input-group .input-label {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-sm);
        }
        
        .input-group .input-label i {
            color: var(--color-red-medium);
        }
        
        .input-with-icon {
            position: relative;
        }
        
        .input-with-icon i {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-red-medium);
            font-size: var(--font-size-lg);
        }
        
        .input-with-icon input {
            padding-left: 3rem;
        }
        
        .password-strength-bar {
            height: 4px;
            background: var(--color-bg-primary);
            border-radius: var(--radius-sm);
            margin-top: var(--spacing-sm);
            overflow: hidden;
        }
        
        .password-strength-fill {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
        }
        
        .strength-weak { background: var(--color-red-bright); width: 33%; }
        .strength-medium { background: var(--color-gold-bright); width: 66%; }
        .strength-strong { background: var(--color-green-medium); width: 100%; }
        
        .submit-btn {
            width: 100%;
            margin-top: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }
        
        .links-section {
            text-align: center;
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--color-border-dark);
        }
        
        .links-section p {
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-sm);
        }
        
        .links-section a {
            color: var(--color-red-bright);
            font-weight: 600;
            transition: all var(--transition-fast);
        }
        
        .links-section a:hover {
            color: var(--color-red-light);
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }
        
        @media (max-width: 768px) {
            .register-container {
                padding: var(--spacing-xl);
            }
            
            .logo-image {
                width: 70px;
                height: 70px;
            }
            
            .logo-title {
                font-size: var(--font-size-2xl);
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo-section">
            <img src="assets/images/logo.svg" alt="UmbraEternum" class="logo-image">
            <h1 class="logo-title">UMBRA</h1>
            <p class="logo-subtitle">Forje sua Lenda</p>
        </div>
        
        <div class="divider-ornament">
            <i class="fas fa-scroll"></i>
        </div>
        
        <div id="alert" class="alert" style="display: none;"></div>
        
        <form id="registerForm">
            <div class="input-group">
                <label class="input-label">
                    <i class="fas fa-user"></i>
                    <span>Nome de Usuário</span>
                </label>
                <div class="input-with-icon">
                    <i class="fas fa-user-circle"></i>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           class="input-medieval" 
                           placeholder="3-20 caracteres" 
                           minlength="3" 
                           maxlength="20" 
                           required>
                </div>
                <div class="input-error-message" id="usernameError" style="display: none;"></div>
            </div>
            
            <div class="input-group">
                <label class="input-label">
                    <i class="fas fa-envelope"></i>
                    <span>Email</span>
                </label>
                <div class="input-with-icon">
                    <i class="fas fa-at"></i>
                    <input type="email" 
                           id="email" 
                           name="email" 
                           class="input-medieval" 
                           placeholder="seu@email.com" 
                           required>
                </div>
                <div class="input-error-message" id="emailError" style="display: none;"></div>
            </div>
            
            <div class="input-group">
                <label class="input-label">
                    <i class="fas fa-lock"></i>
                    <span>Senha</span>
                </label>
                <div class="input-with-icon">
                    <i class="fas fa-key"></i>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="input-medieval" 
                           placeholder="Mínimo 6 caracteres" 
                           minlength="6" 
                           required>
                </div>
                <div class="password-strength-bar">
                    <div class="password-strength-fill" id="strengthBar"></div>
                </div>
                <div class="input-error-message" id="passwordError" style="display: none;"></div>
            </div>
            
            <div class="input-group">
                <label class="input-label">
                    <i class="fas fa-shield-alt"></i>
                    <span>Confirmar Senha</span>
                </label>
                <div class="input-with-icon">
                    <i class="fas fa-shield-alt"></i>
                    <input type="password" 
                           id="confirmPassword" 
                           name="confirmPassword" 
                           class="input-medieval" 
                           placeholder="Digite a senha novamente" 
                           required>
                </div>
                <div class="input-error-message" id="confirmPasswordError" style="display: none;"></div>
            </div>
            
            <button type="submit" class="btn btn-primary submit-btn" id="submitBtn">
                <i class="fas fa-scroll"></i>
                Criar Conta
            </button>
        </form>
        
        <div class="links-section">
            <p>Já possui uma conta? <a href="login.html">Fazer Login</a></p>
            <p><a href="index.html"><i class="fas fa-arrow-left"></i> Voltar</a></p>
        </div>
    </div>
    
    <script src="scripts/api-client.js"></script>
    <script src="scripts/components.js"></script>
    
    <script>
        // LÓGICA MANTIDA DO ORIGINAL
        const form = document.getElementById('registerForm');
        const alert = document.getElementById('alert');
        const submitBtn = document.getElementById('submitBtn');
        const strengthBar = document.getElementById('strengthBar');
        
        const username = document.getElementById('username');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        
        // Validar username
        username.addEventListener('input', function() {
            const value = this.value;
            const error = document.getElementById('usernameError');
            
            if (value.length < 3) {
                this.classList.add('input-error');
                this.classList.remove('input-success');
                error.textContent = 'Username deve ter pelo menos 3 caracteres';
                error.style.display = 'block';
            } else if (!/^[a-zA-Z0-9_]+$/.test(value)) {
                this.classList.add('input-error');
                this.classList.remove('input-success');
                error.textContent = 'Apenas letras, números e underscore';
                error.style.display = 'block';
            } else {
                this.classList.remove('input-error');
                this.classList.add('input-success');
                error.style.display = 'none';
            }
        });
        
        // Validar email
        email.addEventListener('input', function() {
            const error = document.getElementById('emailError');
            
            if (!this.validity.valid) {
                this.classList.add('input-error');
                this.classList.remove('input-success');
                error.textContent = 'Email inválido';
                error.style.display = 'block';
            } else {
                this.classList.remove('input-error');
                this.classList.add('input-success');
                error.style.display = 'none';
            }
        });
        
        // Força da senha
        password.addEventListener('input', function() {
            const value = this.value;
            const error = document.getElementById('passwordError');
            
            let strength = 0;
            if (value.length >= 6) strength++;
            if (value.length >= 10) strength++;
            if (/[a-z]/.test(value) && /[A-Z]/.test(value)) strength++;
            if (/[0-9]/.test(value)) strength++;
            if (/[^a-zA-Z0-9]/.test(value)) strength++;
            
            strengthBar.className = 'password-strength-fill';
            if (strength <= 2) {
                strengthBar.classList.add('strength-weak');
            } else if (strength <= 3) {
                strengthBar.classList.add('strength-medium');
            } else {
                strengthBar.classList.add('strength-strong');
            }
            
            if (value.length < 6) {
                this.classList.add('input-error');
                this.classList.remove('input-success');
                error.textContent = 'Senha deve ter pelo menos 6 caracteres';
                error.style.display = 'block';
            } else {
                this.classList.remove('input-error');
                this.classList.add('input-success');
                error.style.display = 'none';
            }
        });
        
        // Confirmar senha
        confirmPassword.addEventListener('input', function() {
            const error = document.getElementById('confirmPasswordError');
            
            if (this.value !== password.value) {
                this.classList.add('input-error');
                this.classList.remove('input-success');
                error.textContent = 'As senhas não coincidem';
                error.style.display = 'block';
            } else {
                this.classList.remove('input-error');
                this.classList.add('input-success');
                error.style.display = 'none';
            }
        });
        
        // Enviar formulário
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (password.value !== confirmPassword.value) {
                showAlert('As senhas não coincidem', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Criando conta...';
            
            const data = {
                username: username.value,
                email: email.value,
                password: password.value
            };
            
            try {
                const response = await fetch('api/register.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert(`✅ ${result.message} Redirecionando para login...`, 'success');
                    form.reset();
                    
                    setTimeout(() => {
                        window.location.href = 'login.html?registered=1&username=' + encodeURIComponent(result.username);
                    }, 2000);
                } else {
                    showAlert(`❌ ${result.message}`, 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-scroll"></i> Criar Conta';
                }
            } catch (error) {
                showAlert('❌ Erro ao conectar com servidor', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-scroll"></i> Criar Conta';
            }
        });
        
        function showAlert(message, type) {
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            alert.style.animation = 'slideDown 0.3s ease';
            
            setTimeout(() => {
                alert.style.animation = 'fadeOut 0.3s ease';
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 300);
            }, 5000);
        }
        
        // Partículas
        document.addEventListener('DOMContentLoaded', () => {
            const particles = 20;
            for (let i = 0; i < particles; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                particle.style.animationDuration = `${5 + Math.random() * 5}s`;
                document.body.appendChild(particle);
            }
        });
    </script>
</body>
</html>
